<script type='text/babel'>
  const data = {

    'Bronchodilator Metered Dose Inhaler (MDI) Albuterol Sulfate': {

    'Acetylsalicylic Acid': {

  const labels = {
    'classification': 'Classification',
    'administration': 'Administration (Dose)',
    'indications': 'Indications',
    'actions': 'Actions',
    'onset': 'Onset',
    'duration': 'Duration',
    'adverse': 'Adverse Effects',
    'contra': 'Contraindications',
    'reassessment': 'Reassessment Includes',
  }
  // https://stackoverflow.com/questions/2450954/how-to-randomize-shuffle-a-javascript-array
  // Shuffles in-place
  function shuffle(array) {
    let currentIndex = array.length;
    while (currentIndex != 0) {
      let randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [
        array[randomIndex], array[currentIndex]];
    }
    return array
  }
  function normalize(str, removePunctuation) {
    const ret = str.toLowerCase().split(' ').join('')
    if(removePunctuation) {
      return ret.replace(/[^0-9A-Z]+/gi,'')
    } else {
      return ret
    }
  }
  function Hint({text}) {
    const [words, setWords] = React.useState(0)
    const limit = React.useMemo(() => {
      return text.split(' ').length
    }, [text])
    const hint = React.useMemo(() => {
      return text.split(' ').slice(0, words).join(' ')
    }, [text, words])
    function handleClick(e) {
      e.preventDefault()
      if(words < limit) {
        setWords(words+1)
      }
    }
    return <span>
      &nbsp;<a onClick={handleClick}>{words === limit ? '📚' : 'Hint'}</a>&nbsp;{hint}
    </span>
  }
  function Match({label, solution}) {
    const hintRef = React.useRef(null)
    const [text, setText] = React.useState('')
    const [matches, partialMatch] = React.useMemo(() => {
      const normalizedSolution = normalize(solution)
      const normalizedText = normalize(text)
      return [
        normalizedSolution === normalizedText,
        normalizedText === normalizedSolution.substring(0, normalizedText.length)
      ]
    }, [text, solution])
    const inputStyle = {marginBottom: 0}
    if(partialMatch) {
      inputStyle.color = 'green'
    } else {
      inputStyle.color = 'red'
    }
    if(matches) {
      inputStyle.backgroundColor = 'lightgreen'
      inputStyle.color = 'black'
    }
    function handleChange(newVal) {
      if(newVal[newVal.length-1] === '?') {
        if(hintRef.current) {
          // Yeah this is hacky. I don't care since this is a one-off.
          hintRef.current.querySelector('a').click()
        }
        setText(text)
      } else {
        setText(newVal)
      }
    }
    return <li>
      <strong>{label}</strong>
      <span ref={hintRef}><Hint text={solution} /></span>
      <input type='text' value={text} onChange={e => handleChange(e.target.value)} style={inputStyle} />
    </li>
  }
  function Drug({name}) {
    const d = data[name]
    const keys = Object.keys(d)
    return <div>
      <h3>{name}</h3>
      <ul>
        {keys.map(k =>
          <Match key={k} label={labels[k]} solution={d[k]} />
        )}
      </ul>
      <hr />
    </div>
  }
  function Quiz() {
    const drugs = shuffle(Object.keys(data))
    return <div className='row'>
      <div className='small-12 columns'>
        <h2>Firetek 096 Pharmacology Quiz (Fall 2025, LAVC)</h2>
        <div><em>Type <strong>?</strong> for the next hint</em></div>
        {drugs.map(d => <Drug key={d} name={d} />)}
      </div>
    </div>
  }
  const root = ReactDOM.createRoot(document.getElementById('app'))
  root.render(<Quiz />)
</script>
